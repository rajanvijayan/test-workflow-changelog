name: Check CHANGELOG and image.json Version Update

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate-files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files
      id: diff
      run: |
        # Safely detect diff range
        if git rev-parse HEAD^ >/dev/null 2>&1; then
          DIFF_RANGE="HEAD^ HEAD"
        else
          DIFF_RANGE="HEAD"
        fi

        echo "Diffing range: $DIFF_RANGE"

        CHANGED_FILES=$(git diff --name-only $DIFF_RANGE)
        echo "$CHANGED_FILES"

        # Export multiline output correctly
        {
          echo "files<<EOF"
          echo "$CHANGED_FILES"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Check CHANGELOG update
      run: |
        if ! echo "${{ steps.diff.outputs.files }}" | grep -q "CHANGELOG.md"; then
          echo "::error::CHANGELOG.md not updated in this PR."
          exit 1
        fi

    - name: Check image.json update
      run: |
        if ! echo "${{ steps.diff.outputs.files }}" | grep -q "image.json"; then
          echo "::error::image.json not updated in this PR."
          exit 1
        fi

    - name: Validate version field update in image.json
      run: |
        if echo "${{ steps.diff.outputs.files }}" | grep -q "image.json"; then
          
          VERSION_DIFF=$(git diff HEAD^ HEAD -- image.json | grep '"version"' || true)

          if [ -z "$VERSION_DIFF" ]; then
            echo "::error::image.json updated but 'version' field was NOT changed."
            exit 1
          fi

          echo "Version updated successfully:"
          echo "$VERSION_DIFF"
        fi

    - name: All checks passed
      run: echo "✔️ All required file validations passed!"